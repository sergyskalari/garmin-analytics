version: '3.8'

# Stack "hermes": conversational coach over Telegram on top of the
# garmin-sync data. The image must be built first (see README):
#
#   git clone https://github.com/NousResearch/hermes-agent.git
#   cd hermes-agent && docker build -t hermes-agent:local .
#
# Required variables (see .env.example at the repo root):
#   DATA_ROOT, HERMES_UID, HERMES_GID
#
# network_mode: host is intentional -- the dashboard (which stores API keys)
# listens on the host's real 127.0.0.1, reachable only through an SSH tunnel
# (ssh -L 9119:localhost:9119 user@host), never exposed on the network.

services:
  hermes-gateway:
    image: hermes-agent:local
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${DATA_ROOT}/hermes/data:/opt/data
      # Read-only: Hermes must never be able to write to garmin.db.
      - ${DATA_ROOT}/garmin-app/garmin_db/garmin.db:/data/garmin.db:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - TZ=Europe/Madrid
    command: ["gateway", "run"]

  hermes-dashboard:
    image: hermes-agent:local
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - hermes-gateway
    volumes:
      - ${DATA_ROOT}/hermes/data:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]
